name: AI Code Quality and Security Check

on:
  pull_request:
    branches:
      - master
      - main
      - dev
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Automatic code review on every PR
  code-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          claude -p "
          You are reviewing PR #$PR_NUMBER. Follow this process precisely to minimize false positives.

          ## STEP 1: Check eligibility
          Use \`gh pr view $PR_NUMBER\` to check if PR is draft or closed. If so, stop.

          ## STEP 2: Gather context
          - Get PR diff: \`gh pr diff $PR_NUMBER\`
          - Get commits: \`git log origin/$BASE_REF...HEAD --oneline\`
          - Read any CLAUDE.md files in modified directories
          - Focus only on files in web/modules/custom/ and web/themes/custom/

          ## STEP 3: Multi-angle review (find potential issues)
          Review from these 5 perspectives, noting any potential issues:

          A. **CLAUDE.md / Drupal Standards Compliance**
             - 2-space indent, \`elseif\` not \`else if\`, trailing commas
             - \`\\Drupal::\` with leading backslash in procedural code
             - \`\$this->t()\` not \`t()\` in classes
             - \`Html::escape()\` not \`htmlspecialchars()\`

          B. **Obvious Bugs** (shallow scan of changes only)
             - Logic errors, null checks, edge cases
             - Focus on large bugs, not nitpicks

          C. **Git History Context**
             - Check \`git log\` and blame for relevant history
             - Any patterns or past issues?

          D. **Zivtech Commit Conventions**
             - Format: \`TICKET-123: Description\`
             - Imperative mood, capitalize first word

          E. **Security** (critical)
             - XSS, SQL injection, access control

          ## STEP 4: Score each issue (CRITICAL - reduces false positives)
          For EACH potential issue, score 0-100:

          - 0: False positive, doesn't hold up to scrutiny, or pre-existing
          - 25: Might be real, but can't verify. Stylistic issues not in CLAUDE.md
          - 50: Real but nitpicky, not important relative to PR
          - 75: Verified real, will impact functionality, or explicitly in CLAUDE.md
          - 100: Definitely real, will happen frequently, evidence confirms

          ## STEP 5: Filter
          ONLY report issues scoring 75 or higher. Discard the rest.

          ## FALSE POSITIVES TO IGNORE:
          - Pre-existing issues (not introduced in this PR)
          - Things a linter/typechecker would catch
          - General quality issues unless in CLAUDE.md
          - Changes in functionality that are likely intentional
          - Issues on lines the user didn't modify

          ## STEP 6: Post review
          Use \`gh pr comment $PR_NUMBER --body \"<review>\"\`

          Format (if issues found):
          ---
          ### Code Review

          Found N issues:

          1. <description> (reason: <CLAUDE.md says X / bug due to Y>)
             <link to file:line>

          ---
          🤖 Generated with Claude Code

          Format (if no issues):
          ---
          ### Code Review

          No issues found. Checked for bugs, Drupal standards, and commit conventions.

          🤖 Generated with Claude Code
          ---
          " \
          --allowedTools "Bash(gh:*),Bash(git:*),Read,Glob,Grep" \
          --max-turns 15

  # Interactive @claude mentions
  interactive-claude:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Interactive Response
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Glob,Grep"
          timeout_minutes: "10"
