name: AI Code Quality and Security Check

on:
  pull_request:
    branches:
      - master
      - main
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  # Note: issues:write is required because GitHub's API treats PR comments as
  # "issue comments" internally. This does NOT create GitHub Issues - all
  # feedback is posted directly as PR comments.
  issues: write

jobs:
  AI-Quality-Security-Check:
    runs-on: ubuntu-latest
    # Run on PR events, or on issue comments that mention @claude
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    env:
      CODE_REVIEW_PATHS: ${{ vars.CODE_REVIEW_PATHS || 'web/modules/custom/ web/themes/custom/' }}
      CODE_REVIEW_FILE_EXCLUDE_REGEX: ${{ vars.CODE_REVIEW_FILE_EXCLUDE_REGEX || '\.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$|node_modules/|vendor/|dist/|build/' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are an expert Drupal code reviewer. Review this pull request following these standards:

            ## Files to Review
            Focus on files in: ${{ env.CODE_REVIEW_PATHS }}
            Exclude files matching: ${{ env.CODE_REVIEW_FILE_EXCLUDE_REGEX }}

            ---
            # DRUPAL CODING STANDARDS
            Reference: https://project.pages.drupalcode.org/coding_standards/

            ## PHP Standards
            - 2-space indentation, never tabs
            - No trailing whitespace, Unix line endings
            - 80-character line maximum (with allowed exceptions)
            - Always use curly braces for control structures
            - Use `elseif`, NEVER `else if`
            - Space between keyword and parenthesis: `if ($condition)`
            - Short array syntax with trailing commas: `['item',]`
            - Spaces around concatenation: `'Foo' . $bar`
            - Single quotes by default, double for interpolation

            ## Drupal-Specific PHP
            - Leading backslash on `\Drupal::` calls in procedural code
            - Use `$this->t()` instead of `t()` in classes
            - Use `Html::escape()` NOT `htmlspecialchars()`
            - Use `#type => 'processed_text'` NOT `check_markup()`
            - Use `Entity::loadMultiple()` NOT `Entity::load()` in loops
            - String keys for render array children (not numeric)
            - Prefer dependency injection over static service calls

            ## Security Checks
            - Check for XSS vulnerabilities (unescaped output)
            - Verify SQL queries use parameterized queries
            - Check for proper access controls
            - Validate user input before use
            - Use `Url::fromUserInput()` for path validation

            ## Twig Standards
            - Use `|escape('html_attr')` for URLs and attributes
            - Use `{{ 'String'|t }}` for translations
            - Ensure accessible disclosure widgets (heading wraps button)
            - Verify `aria-controls` matches controlled element `id`

            ## JavaScript Standards
            - Use `once()` in Drupal behaviors
            - Use strict equality (`===` and `!==`)
            - Use `let` or `const`, not `var`
            - 2-space indentation

            ## CSS/SCSS Standards
            - 2-space indentation
            - One selector per line

            ---
            # ZIVTECH GIT CONVENTIONS

            ## Commit Message Format
            Commits MUST include ticket number: `TICKET-123: Description`
            - Ticket ID followed by colon and space
            - Capitalize first word
            - Use imperative mood ("Add" not "Added")
            - First line under 72 characters

            ## Branch Naming
            Branches should follow: `TICKET-123/short-description`

            ---
            # REVIEW INSTRUCTIONS

            1. **Check all commits** in this PR for proper ticket number formatting
            2. **Review code changes** against Drupal coding standards
            3. **Identify security issues** as HIGH priority
            4. **Check accessibility** in Twig templates
            5. **Suggest improvements** with specific code examples

            ## Output Format
            Structure your review as:

            ### Summary
            Brief overview of the changes and overall quality.

            ### Commit Messages
            ✅ or ❌ for each commit's format compliance.

            ### Issues Found
            List issues by severity:
            - 🔴 **Critical**: Security vulnerabilities, data loss risks
            - 🟠 **Warning**: Coding standard violations, potential bugs
            - 🟡 **Suggestion**: Best practices, performance improvements

            ### Code Examples
            For each issue, show the problematic code and the suggested fix.

            ### Accessibility
            Note any accessibility concerns in templates.

            ### Positive Feedback
            Highlight well-written code following best practices.
          allowed_tools: "Bash,Read,Glob,Grep"
          timeout_minutes: "15"
