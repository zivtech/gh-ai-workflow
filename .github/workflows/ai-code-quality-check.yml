name: AI Code Quality and Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main
      - dev
  issue_comment:
    types: [created]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Automatic code review on every PR
  code-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@^1

      - name: Cache Skills
        uses: actions/cache@v4
        with:
          path: ~/.agents/skills
          key: skills-v1-${{ hashFiles('.github/workflows/ai-code-quality-check.yml') }}

      - name: Install Skills
        env:
          SKILLS_DEPLOY_KEY: ${{ secrets.ZIVTECH_SKILLS_DEPLOY_KEY }}
        run: |
          set -e

          # Set up SSH for private repo access
          mkdir -p ~/.ssh
          echo "$SKILLS_DEPLOY_KEY" > ~/.ssh/skills_deploy_key
          chmod 600 ~/.ssh/skills_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/skills_deploy_key -o StrictHostKeyChecking=no"

          # Install Zivtech private skills
          npx skills add git@github.com:zivtech/zivtech-claude-skills.git -s drupal-coding-standards -s zivtech-development-workflow -g -y

          # Install third-party skills
          npx skills add madsnorgaard/agent-resources@drupal-security -g -y

          # Clean up
          rm -f ~/.ssh/skills_deploy_key

          echo "Skills installed:"
          npx skills ls -g

      - name: Prepare Diff
        id: prep-diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Regex pattern to exclude files (optional, set in repo vars)
          FILE_EXCLUDE_REGEX: ${{ vars.CODE_REVIEW_FILE_EXCLUDE_REGEX }}
        run: |
          set -e

          # Get full diff from PR
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff-full.txt

          # Filter diff sections to only include reviewable files
          # Keeps: modules/custom/, themes/custom/ (any web root), composer.json, composer.lock, package.json
          # Preserves exact unified diff format with line numbers
          awk '
            /^diff --git/ {
              include = 0
              if ($0 ~ /modules\/custom\// ||
                  $0 ~ /themes\/custom\// ||
                  $0 ~ /composer\.json/ ||
                  $0 ~ /composer\.lock/ ||
                  $0 ~ /package\.json/) {
                include = 1
              }
            }
            include { print }
          ' /tmp/pr-diff-full.txt > /tmp/pr-diff-included.txt

          # Apply exclude regex if set
          if [ -n "$FILE_EXCLUDE_REGEX" ]; then
            awk -v regex="$FILE_EXCLUDE_REGEX" '
              /^diff --git/ {
                file = $0
                sub(/.*b\//, "", file)
                include = 1
                if (file ~ regex) { include = 0 }
              }
              include { print }
            ' /tmp/pr-diff-included.txt > /tmp/pr-diff.txt
          else
            mv /tmp/pr-diff-included.txt /tmp/pr-diff.txt
          fi

          # Extract list of files being reviewed
          grep '^diff --git' /tmp/pr-diff.txt | sed 's|diff --git a/.* b/||' > /tmp/pr-files-filtered.txt || true

          # Summary for logs
          TOTAL=$(grep -c '^diff --git' /tmp/pr-diff-full.txt || echo 0)
          FILTERED=$(wc -l < /tmp/pr-files-filtered.txt | tr -d ' ')
          DIFF_LINES=$(wc -l < /tmp/pr-diff.txt | tr -d ' ')
          echo "Files in PR: $TOTAL | Files to review: $FILTERED | Diff lines: $DIFF_LINES"
          cat /tmp/pr-files-filtered.txt

          # Fast-path: if no reviewable files, post comment directly and skip Claude
          if [ "$FILTERED" -eq 0 ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            BODY="### Code Review

          No reviewable code changes (only contrib/vendor changes).

          ---
          🤖 Generated with Claude Code"
            COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '[.[] | select(.body | contains("Generated with Claude Code")) | .id] | last')
            if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
            else
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
            echo "No reviewable files — skipping Claude invocation."
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"

            # Pre-concatenate skill references so Claude reads one file instead of three
            {
              echo "=== DRUPAL CODING STANDARDS ==="
              cat ~/.agents/skills/drupal-coding-standards/SKILL.md 2>/dev/null || echo "(not installed)"
              echo ""
              echo "=== ZIVTECH DEVELOPMENT WORKFLOW ==="
              cat ~/.agents/skills/zivtech-development-workflow/SKILL.md 2>/dev/null || echo "(not installed)"
              echo ""
              echo "=== DRUPAL SECURITY ==="
              cat ~/.agents/skills/drupal-security/SKILL.md 2>/dev/null || echo "(not installed)"
            } > /tmp/skills-reference.txt

            # Pre-fetch PR metadata so Claude doesn't need separate gh calls
            gh pr view "$PR_NUMBER" --json state,commits,title -q '{state: .state, title: .title, commits: [.commits[].messageHeadline]}' > /tmp/pr-metadata.json

            # Pre-fetch existing review comment ID (if any) so Claude can update instead of creating
            EXISTING_COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '[.[] | select(.body | contains("Generated with Claude Code")) | .id] | last')
            if [ -n "$EXISTING_COMMENT_ID" ] && [ "$EXISTING_COMMENT_ID" != "null" ]; then
              echo "$EXISTING_COMMENT_ID" > /tmp/existing-comment-id.txt
              echo "Found existing review comment: $EXISTING_COMMENT_ID"
            else
              echo "" > /tmp/existing-comment-id.txt
              echo "No existing review comment found, will create new."
            fi
          fi

      - name: Run Code Review
        if: steps.prep-diff.outputs.has_diff == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude -p "
          Review PR #$PR_NUMBER for bugs, security issues, and coding standards.

          ## CRITICAL: Scope of review
          - The diff has been pre-filtered to only include custom code (modules/custom/, themes/custom/) and dependency files
          - /tmp/pr-diff.txt contains ONLY the files you should review
          - /tmp/pr-files-filtered.txt lists the files included in the review
          - REPORT issues ONLY on lines added/modified in this PR (lines with \`+\` prefix in diff)
          - DO NOT report issues on pre-existing code that wasn't changed in this PR
          - DO NOT read or review files outside the filtered set
          - AVAILABLE TOOLS: Use Read to read files, Write to write files, Glob/Grep to search. For shell: only \`git\` and \`cat\`. Do NOT run \`gh\` commands — all GitHub data is pre-fetched.

          ## STEP 1: Gather context (use PARALLEL tool calls to save turns)
          Read ALL of these files in a SINGLE parallel tool call:
          - /tmp/pr-metadata.json — PR state, title, and commit messages (pre-fetched)
            - If state is CLOSED or MERGED: write \"### Code Review\\n\\nPR is [state], skipping review.\\n\\n---\\n🤖 Generated with Claude Code\" to /tmp/review-body.txt and stop
          - /tmp/pr-diff.txt — the pre-filtered diff (ONLY file you should review)
            - If > 1500 lines: use large PR format (review all categories but only report 🔴 Critical issues, not 🟠 Warnings)
          - /tmp/pr-files-filtered.txt — list of files included in the review
          - /tmp/skills-reference.txt — coding standards, workflow conventions, and security checks (pre-concatenated)
          - /tmp/existing-comment-id.txt — existing review comment ID to update (empty if none)
          Then in a second call, read any CLAUDE.md files in modified directories (derive paths from /tmp/pr-files-filtered.txt).
          Detect project type from the diff content (look for drupal/core in composer.json, *.module files, etc.).

          ## STEP 2: What to check (ONLY in added/changed lines)

          ### 🔒 SECURITY
          - XSS: unescaped user input in output
          - SQL injection: non-parameterized queries
          - Access control: missing permission checks
          - Hard-coded credentials, API keys, or secrets
          - Sensitive data in logs or error messages
          - Insecure deserialization

          ### ⚡ PERFORMANCE
          - N+1 queries: loading in loops vs batch loading
          - Missing caching on expensive operations
          - Inefficient loops or unnecessary iterations
          - Missing pagination on large data sets

          ### 🔧 MAINTAINABILITY
          - Prefer dependency injection over static/global access
          - Magic numbers/strings → use constants
          - Missing or inadequate error handling
          - Overly complex functions (split them)
          - Dead code or unreachable branches
          - Missing type hints

          ### 🔍 FUNCTIONALITY
          - Null/empty checks before operations
          - Edge cases (empty arrays, null, zero)
          - Logic errors in conditionals
          - Missing input validation
          - Off-by-one errors

          ### 🟨 JAVASCRIPT (*.js, *.ts, *.jsx, *.tsx, *.vue)
          Security:
          - No \`eval()\`, \`new Function()\`, or \`innerHTML\` with unsanitized input
          - No \`document.write()\`
          Maintainability:
          - Use \`const\`/\`let\`, not \`var\`
          - Use \`===\` not \`==\`
          - Remove \`console.log\`/\`debugger\` statements
          - Async functions need error handling (try/catch or .catch())
          Performance:
          - Cache DOM queries outside loops
          - Clean up event listeners (removeEventListener or AbortController)

          ### 🎨 CSS (*.css, *.scss, *.less)
          - Avoid \`!important\` (except utility classes)
          - Use CSS custom properties for repeated values (colors, spacing)
          - Keep selector specificity low
          - No \`*\` selector in production code

          ### ♿ ACCESSIBILITY (HTML/Twig templates)
          - Images need \`alt\` attributes (empty \`alt=\"\"\` for decorative)
          - Form inputs need associated \`<label>\` elements
          - \`target=\"_blank\"\` links need \`rel=\"noopener noreferrer\"\`
          - Headings follow hierarchy (h1 → h2 → h3, no skipping)
          - Interactive elements need accessible names

          ### 🐘 DRUPAL-SPECIFIC (apply if Drupal detected in STEP 1)
          Reference ~/.agents/skills/drupal-coding-standards/SKILL.md for full Drupal coding standards.
          Reference ~/.agents/skills/drupal-security/SKILL.md for security checks.
          Quick reference:
          - \`\\Drupal::\` needs leading backslash in procedural code
          - Use \`\$this->t()\` not \`t()\` in classes; \`Html::escape()\` not \`htmlspecialchars()\`
          - Use \`Entity::loadMultiple()\` not \`Entity::load()\` in loops
          - Use \`Url::fromUserInput()\` for user-supplied paths
          - Use \`elseif\` not \`else if\`; trailing commas in arrays
          - Twig: \`|escape('html_attr')\` for attributes, \`{{ 'text'|t }}\`
          - JS: Use \`once()\` in Drupal.behaviors, \`'use strict'\`
          - Ref: https://project.pages.drupalcode.org/coding_standards/

          ### 📦 DEPENDENCIES (composer.json, composer.lock, package.json)
          - New unvetted packages added without justification
          - Packages removed that provide security functionality
          - Version downgrades on existing packages
          - Packages with known vulnerabilities or abandoned status

          ### ⚙️ DRUPAL CONFIG YAML (*.yml in config/ directories)
          - Permission changes: new roles, expanded permissions, \`administer\` grants
          - Access control: \`accessCheck: FALSE\`, route permission changes
          - Exposed fields or views that could leak data
          - Changes to user roles or authentication settings

          ### 📝 PR TITLE & COMMITS (Zivtech convention)
          - Format: \`TICKET-123: Description\` (imperative mood, capitalized)
          - Check both PR title AND individual commit messages
          - Missing ticket entirely = score 75 (🟠 Warning)
          - Minor format issues (case, mood, punctuation) = score 50 (discard)

          ## STEP 3: Score and classify each issue
          **Score (determines if reported):**
          - 0-49: DISCARD (existing code, nitpicks, or minor issues)
          - 50-74: DISCARD (real but minor, not worth flagging)
          - 75-89: REPORT as 🟠 Warning
          - 90-100: REPORT as 🔴 Critical (security, data loss, crashes)

          Before reporting ANY issue, verify the line appears with a \`+\` prefix in the diff.

          ## STEP 4: Write review to file
          Write the final review to /tmp/review-body.txt using the Write tool (or \`cat > /tmp/review-body.txt << 'ENDREVIEW' ... ENDREVIEW\`).
          DO NOT post the review to GitHub — a subsequent workflow step handles that.

          **Output format (write this to /tmp/review-body.txt):**
          \`\`\`
          ### Code Review

          **PR Title:** ✅ TICKET-123: Add feature | ❌ \"fixed stuff\" (missing ticket)
          **Commits:** ✅ All follow convention | ❌ \"fixed stuff\" (missing ticket)

          **🔒 Security:** None found
          **⚡ Performance:** None found
          **🔧 Maintainability:** None found
          **🔍 Functionality:** None found
          **📦 Dependencies:** None found
          **⚙️ Config:** None found

          ✨ Positive observation (always include one!)

          ---
          🤖 Generated with Claude Code
          \`\`\`

          **When listing issues, use this format:**
          - 🔴/🟠 **Title** - Description. \`bad code\` → \`fix\`. [file:line](link)

          **Severity (from STEP 3 scoring):**
          - 🔴 Critical (90-100): Security holes, data loss, crashes
          - 🟠 Warning (75-89): Bugs, standards violations, performance issues

          **For large PRs (>1500 lines), use this format instead:**
          \`\`\`
          ### Code Review ⚠️ Large PR

          This PR has X lines changed across N files. Only 🔴 Critical issues are reported for large PRs. Consider breaking large PRs into smaller, focused changes for more thorough review.

          **PR Title:** ✅ or ❌
          **Commits:** ✅ or ❌

          **🔒 Security:** [issues or None found]
          **⚡ Performance:** [issues or None found]
          **🔧 Maintainability:** [issues or None found]
          **🔍 Functionality:** [issues or None found]
          **📦 Dependencies:** [issues or None found]
          **⚙️ Config:** [issues or None found]

          ✨ Positive observation

          ---
          🤖 Generated with Claude Code
          \`\`\`

          If no issues in a category, show \"None found\".
          " \
          --allowedTools "Bash(git:*),Bash(cat:*),Read,Write,Glob,Grep" \
          --max-turns 20

      - name: Post Review Comment
        if: steps.prep-diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          if [ ! -s /tmp/review-body.txt ]; then
            echo "Warning: /tmp/review-body.txt is empty or missing. Claude may have run out of turns."
            echo "### Code Review

          ⚠️ Review could not be completed (agent reached turn limit). Please re-run or review manually.

          ---
          🤖 Generated with Claude Code" > /tmp/review-body.txt
          fi

          COMMENT_ID=$(cat /tmp/existing-comment-id.txt 2>/dev/null | tr -d '[:space:]')
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments/$COMMENT_ID" \
              -X PATCH \
              -F body=@/tmp/review-body.txt
            echo "Updated existing comment $COMMENT_ID"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/review-body.txt
            echo "Created new comment"
          fi

  # Interactive @claude mentions
  # Note: Broader Bash access allowed here for interactive flexibility
  interactive-claude:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Skills
        uses: actions/cache@v4
        with:
          path: ~/.agents/skills
          key: skills-v1-${{ hashFiles('.github/workflows/ai-code-quality-check.yml') }}

      - name: Install Skills
        env:
          SKILLS_DEPLOY_KEY: ${{ secrets.ZIVTECH_SKILLS_DEPLOY_KEY }}
        run: |
          set -e

          # Set up SSH for private repo access
          mkdir -p ~/.ssh
          echo "$SKILLS_DEPLOY_KEY" > ~/.ssh/skills_deploy_key
          chmod 600 ~/.ssh/skills_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/skills_deploy_key -o StrictHostKeyChecking=no"

          # Install Zivtech private skills
          npx skills add git@github.com:zivtech/zivtech-claude-skills.git -s drupal-coding-standards -s zivtech-development-workflow -g -y

          # Install third-party skills
          npx skills add madsnorgaard/agent-resources@drupal-security -g -y

          # Clean up
          rm -f ~/.ssh/skills_deploy_key

      - name: Claude Interactive Response
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Glob,Grep"
          timeout_minutes: "10"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
